<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUNCHFLIX</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <!-- Global Dynamic Background Layer -->
    <div class="global-bg-container">
        <img id="np-bg-image" class="global-bg-image" src="" alt="">
        <div class="global-bg-overlay"></div>
    </div>

    <!-- Auth Flow: Not Connected -->
    <div id="auth-section" class="hidden auth-wrapper glass-panel">
        <h2 class="auth-title">CRUNCHFLIX</h2>
        <p class="auth-subtitle">Sync your watch history to Trakt</p>
        <button id="authBtn" class="btn-primary">Connect to Trakt</button>
        <button id="settingsBtnAuth" class="btn-secondary mt-sm">API Settings</button>
    </div>

    <!-- Auth Flow: Code Entry -->
    <div id="code-section" class="hidden auth-wrapper glass-panel">
        <h2 class="auth-title">AUTHORize</h2>
        <div id="trakt-code-display" class="trakt-code">----</div>
        <p class="auth-subtitle">Go to <b>trakt.tv/activate</b><br>and enter the code above.</p>
        <button id="checkAuthBtn" class="btn-primary">I've Authorized</button>
    </div>

    <!-- Main Connected UI -->
    <div id="connected-section" class="hidden">
        <div class="app-card">

            <!-- 1. Media Context Section (Top) -->
            <div class="poster-header">
                <img id="np-image" class="full-poster-image" src="" alt="Poster">
                <div class="poster-gradient"></div>

                <div id="np-status" class="status-badge paused">
                    <svg class="status-icon pause-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                    </svg>
                    <span class="status-text">PAUSED</span>
                </div>
            </div>

            <!-- Content Container -->
            <div class="app-content">
                <div class="title-container">
                    <h2 id="np-title" class="show-title">Nothing Playing</h2>
                </div>

                <div class="metadata-row">
                    <span id="meta-year"></span>
                    <span id="np-episode"></span>
                    <span id="meta-runtime" class="tabular-nums"></span>
                    <span id="meta-genres"></span>
                </div>

                <!-- NEW: Synopsis -->
                <p id="np-synopsis" class="synopsis-text hidden">Synopsis goes here.</p>

                <div class="progress-track mt-4 mb-4">
                    <div id="play-progress-bar" class="progress-fill"></div>
                </div>

                <!-- 2. Primary Actions Section (Middle) -->
                <div class="primary-actions-v2">
                    <button id="fixMatchBtn" class="btn-ghost-v2 main-action" title="Fix Show">
                        <svg class="action-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                            </path>
                        </svg>
                        <span class="action-label">Fix Show</span>
                    </button>
                    <button id="fixEpisodeBtn" class="btn-ghost-v2 main-action" title="Fix Episode">
                        <svg class="action-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z">
                            </path>
                        </svg>
                        <span class="action-label">Fix Ep</span>
                    </button>
                    <!-- Settings button is smaller -->
                    <button id="settingsBtn" class="btn-ghost-v2 settings-action" title="Settings">
                        <svg class="action-icon no-margin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                            </path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                    </button>
                </div>

                <!-- Fix Panels (Hidden by default) -->
                <div id="fix-section" class="expanded-panel hidden">
                    <span class="panel-label">Search Trakt</span>
                    <div class="search-field">
                        <input type="text" id="fixInput" placeholder="Show title...">
                        <button id="fixSearchBtn" class="btn-primary">🔍</button>
                    </div>
                    <div id="fix-status" class="status-info"></div>
                    <div id="fix-results" class="results-list hidden"></div>
                    <button id="cancelFixBtn" class="btn-secondary mt-sm">Cancel</button>
                </div>

                <div id="fix-episode-section" class="expanded-panel hidden">
                    <span class="panel-label">Manual Episode Mapping</span>
                    <div class="search-field">
                        <input type="number" id="fixSeasonInput" placeholder="S" min="1">
                        <input type="number" id="fixEpInput" placeholder="E" min="1">
                        <button id="saveEpFixBtn" class="btn-primary">Save</button>
                    </div>
                    <div id="fix-ep-status" class="status-info"></div>
                    <button id="cancelEpFixBtn" class="btn-secondary mt-sm">Cancel</button>
                </div>

                <!-- 3. System Actions Section (Bottom) -->
                <div class="system-actions">
                    <button id="openHistoryBtn" class="sys-link primary-sys-link">Sync History</button>
                    <div class="sys-actions-right">
                        <button id="resetMappingsBtn" class="sys-link muted-sys-link">Reset</button>
                        <button id="disconnectBtn" class="sys-link danger-sys-link">Disconnect</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
